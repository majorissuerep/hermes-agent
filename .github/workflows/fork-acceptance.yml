name: Fork acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'audit/**', 'fix/audit-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Fork contracts / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --python '${{ matrix.python }}' --extra dev --extra lancedb-memory
      - name: Record exact qualification inputs
        run: |
          git rev-parse HEAD
          .venv/bin/python --version
          sha256sum pyproject.toml uv.lock package-lock.json
      - name: Run isolated fork contracts (no retries)
        run: |
          paths=(
            tests/hermes_security/
            tests/plugins/memory/test_lancedb*.py
            tests/scripts/test_security_scan_contract.py
            tests/hermes_state/test_deck_registry.py
            tests/hermes_cli/test_cli_deck.py
            tests/hermes_cli/test_host_startup_diagnostics.py
            tests/tui_gateway/test_deck_host.py
            tests/gateway/test_external_platforms_kill_switch.py
            tests/tools/test_user_native_shell.py
            tests/agent/test_prompt_cache_boundary.py
            tests/agent/test_prompt_cache_scope.py
            tests/hermes_cli/test_config_loader_e2e.py
          )
          # The canonical runner tolerates missing explicit paths. This gate must not.
          for path in "${paths[@]}"; do
            test -e "$path" || { printf 'Missing required test path: %s\n' "$path"; exit 1; }
          done
          scripts/run_tests.sh "${paths[@]}" -j 2 --file-retries 0

  acceptance:
    name: Fork acceptance
    needs: contracts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix member to succeed
        env:
          RESULT: ${{ needs.contracts.result }}
        run: |
          printf 'Contract matrix result: %s\n' "$RESULT"
          test "$RESULT" = success
