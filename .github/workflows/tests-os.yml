name: OS-specific tests

# Runs the tests that can only be trusted on their own host OS.
#
# The main Python suite has no compiled Ink prerequisite. This workflow builds
# the real terminal UI for explicit Linux usability tests and the macOS-marked
# suite, so neither native host relies on optional TUI skips or a faked OS.
#
#   macos    → ``-m platforms``    on macos-latest
#   linux    → public terminal and update-completion contracts on ubuntu-latest
#
# (tests/conftest.py's ``pytest_collection_modifyitems`` hook skips
# foreign-OS ``platforms(...)`` markers on each host, so one shared ``-m
# platforms`` expression selects "this host's own marked tests" on either
# lane — the helper narrows WHICH FILES get imported first.)
#
# macOS keeps its two existing file slices; Linux runs its explicit files serially.
# Each lane FAILS when it selects zero tests — a
# renamed marker or bad selector can never report a green job that ran
# nothing.

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      strict_acceptance:
        description: >-
          Acceptance runs only: known_failure owners whose gaps FAIL this run instead of xfailing ('upd-txn', a comma list, or '1' for every gap). Sets HERMES_E2E_STRICT_ACCEPTANCE for the E2E suites (tests/e2e/core/_pending_fixes.py).
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: tests-os-${{ (github.ref_type == 'tag' || inputs.commit != '') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.commit == '' }}

jobs:
  os-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ github.repository == 'NousResearch/hermes-agent' && 30 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux terminal usability
            runner: ubuntu-latest
            marker: linux
            workers: 1
            files: >-
              tests/tui_runtime/test_terminal_model_pty.py
              tests/tui_runtime/test_terminal_global_model_pty.py
              tests/tui_runtime/test_terminal_session_naming_pty.py
              tests/tui_runtime/test_terminal_pty_custody.py
              tests/hermes_cli/test_update_finish.py
          # Two slices on the free standard runner (3 cores, 3 workers): one lane ran
          # ~7.5 min and became the slowest required job once the Linux suite split.
          - name: macOS-only tests (1/2)
            runner: macos-latest
            marker: macos
            slice: 1/2
          - name: macOS-only tests (2/2)
            runner: macos-latest
            marker: macos
            slice: 2/2
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          packages: 'ripgrep'
          extras: '["all", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Install Node deps and build the Ink TUI
        uses: ./.github/actions/retry
        with:
          command: npm ci --workspace ui-tui --ignore-scripts --no-audit --no-fund && npm run build --workspace ui-tui

      - name: Run ${{ matrix.marker }} tests
        # scripts/run_tests.sh — the canonical runner, same as every other
        # lane: per-file subprocess isolation (run_tests_parallel.py). It
        # natively tolerates per-file empty collections (a platform-gated
        # file collects nothing after -m filtering, exit 5, treated as a
        # pass for that file) and fails the run itself when NOTHING was
        # collected across all files (exit 2) — the zero-tests guard the
        # bare-pytest variant implemented by hand with an exit-5 branch.
        #
        # Selection still narrows WHICH FILES run:
        # Linux supplies its explicit usability files; on macOS,
        # scripts/ci/list_os_marked_tests.py emits the file list (it exits
        # non-zero when the marker matches no file at all); the list rides
        # to the runner via ``--files`` so an unrelated ImportError fails
        # only ITS file, red and visible, without poisoning the lane's
        # other files. ``-m`` stays authoritative for which TESTS run —
        # passed after ``--`` so the runner routes it to every per-file
        # pytest invocation (the flag REPLACES pyproject's addopts, hence
        # repeating ``not integration``).
        #
        # ``--timeout-method`` needs no override: tests/conftest.py's
        # pytest_configure already downgrades the signal-based timer on
        # Windows, which has no SIGALRM.
        shell: bash
        run: |
          set -uo pipefail

          LIST="${RUNNER_TEMP:-.}/selected-tests.txt"

          # Process substitution would hide the helper's exit status, so write
          # to a file and check it explicitly.
          if [ -n "${{ matrix.files }}" ]; then
            printf '%s\n' ${{ matrix.files }} > "$LIST"
          elif ! python scripts/ci/list_os_marked_tests.py \
                 "${{ matrix.marker }}" > "$LIST"; then
            echo "::error::could not enumerate ${{ matrix.marker }} test files"
            exit 1
          fi
          if [ ! -s "$LIST" ]; then
            echo "::error::empty ${{ matrix.marker }} file list"
            exit 1
          fi

          echo "selected file(s) for ${{ matrix.marker }}:"
          cat "$LIST"

          EXTRA_ARGS=()

          # ``tr -d '\r'``: defensive CRLF strip (fork: POSIX runners).
          # line endings; a stray \r would corrupt the path. The list
          # uses the native path-list separator consumed by --files.
          #
          # Any non-zero exit propagates red: real test failures, or the
          # runner's own zero-run guard (every file filtered to empty by
          # ``-m`` — "must never pass without running its OS's tests").
          SEPARATOR="$(python -c 'import os, sys; sys.stdout.write(os.pathsep)')"
          FILES="$(tr -d '\r' < "$LIST" | paste -sd "$SEPARATOR" -)"
          scripts/run_tests.sh --files "$FILES" -- \
            ${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"} \
            -m "platforms and not integration" \
            -v --tb=short
        env:
          # Linux serializes real PTYs; preserve the existing macOS worker count.
          HERMES_TEST_WORKERS: ${{ matrix.workers || (github.repository == 'NousResearch/hermes-agent' && '16' || '3') }}
          HERMES_E2E_REQUIRE_TUI: '1'
          HERMES_TEST_SLICE: ${{ matrix.slice || '' }}
          # Belt-and-suspenders with tests/conftest.py's env blanking: no
          # test may reach a real provider API.
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''

      - name: Check the checkout is clean
        # Last step of every job (tests/ci/test_clean_worktree_check.py): a test or CI step that
        # leaves an untracked or modified file in the checkout is reported here. Runs only when
        # every earlier step passed: a step that failed midway can leave its own temp files
        # (a half-extracted download, a worktree its later cleanup never removed).
        uses: ./.github/actions/check-clean-worktree
