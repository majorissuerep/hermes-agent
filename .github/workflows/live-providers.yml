name: Live provider acceptance

# Explicit, spend-capped qualification. No schedules, automatic upstream tags,
# provider skips, raw uv/pip installs, or direct pytest entry points.
on:
  workflow_dispatch:
    inputs:
      connection:
        description: 'Dedicated test connection; never upload personal subscription credentials'
        type: choice
        options: [litellm, custom_openai, custom_anthropic, anthropic, openai, chatgpt, zai, grok, grok_subscription, vercel]
        default: litellm
      api_mode:
        description: 'all runs every protocol supported by the selected connection'
        type: choice
        options: [all, chat_completions, codex_responses, anthropic_messages]
        default: all
      platform:
        description: 'Native qualification target'
        type: choice
        options: [all, linux, macos]
        default: all

permissions:
  contents: read

concurrency:
  group: live-providers-${{ github.ref }}-${{ inputs.connection }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      provider: ${{ steps.matrix.outputs.provider }}
    env:
      CONNECTION: ${{ inputs.connection }}
      API_MODE: ${{ inputs.api_mode }}
      PLATFORM: ${{ inputs.platform }}
      HAS_KEY: ${{ secrets[format('LIVE_{0}_API_KEY', inputs.connection)] != '' || (inputs.connection == 'litellm' && secrets.E2E_LLM_API_KEY != '') }}
      BASE_URL: ${{ vars[format('LIVE_{0}_BASE_URL', inputs.connection)] || (inputs.connection == 'litellm' && vars.E2E_LLM_BASE_URL) || '' }}
      MODEL: ${{ vars[format('LIVE_{0}_MODEL', inputs.connection)] || (inputs.connection == 'litellm' && vars.E2E_LLM_MODEL) || '' }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Fail closed on missing configuration and select supported protocols
        id: matrix
        shell: python
        run: |
          import json, os, sys
          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          if os.environ["HAS_KEY"] != "true" or not os.environ["BASE_URL"] or not os.environ["MODEL"]:
              raise SystemExit("Configure a dedicated LIVE_<connection>_API_KEY secret and matching BASE_URL/MODEL variables. LiteLLM may use E2E_LLM_*.")
          from scripts.e2e.provider_matrix import CONNECTIONS
          connection = CONNECTIONS[os.environ["CONNECTION"]]
          provider, modes = connection.provider, list(connection.modes)
          requested = os.environ["API_MODE"]
          if requested != "all":
              if requested not in modes:
                  raise SystemExit("That protocol is not supported by the selected connection")
              modes = [requested]
          runners = {"all": ["ubuntu-24.04", "macos-15", "macos-15-intel"],
                     "linux": ["ubuntu-24.04"], "macos": ["macos-15", "macos-15-intel"]}[os.environ["PLATFORM"]]
          matrix = {"include": [{"runner": runner, "mode": mode} for runner in runners for mode in modes]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix) + "\nprovider=" + provider + "\n")

  live:
    name: ${{ inputs.connection }} / ${{ matrix.mode }} / ${{ matrix.runner }}
    needs: select
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked runtime before exposing the test credential
        uses: ./.github/actions/setup-pm
        with:
          extras: '["all", "anthropic"]'
          cache: false
          cache-python: false
      - name: Growing encrypted conversation, compaction and restart
        env:
          DEDICATED_KEY: ${{ secrets[format('LIVE_{0}_API_KEY', inputs.connection)] || (inputs.connection == 'litellm' && secrets.E2E_LLM_API_KEY) || '' }}
          BASE_URL: ${{ vars[format('LIVE_{0}_BASE_URL', inputs.connection)] || (inputs.connection == 'litellm' && vars.E2E_LLM_BASE_URL) || '' }}
          MODEL: ${{ vars[format('LIVE_{0}_MODEL', inputs.connection)] || (inputs.connection == 'litellm' && vars.E2E_LLM_MODEL) || '' }}
          PROVIDER: ${{ needs.select.outputs.provider }}
          API_MODE: ${{ matrix.mode }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          credential = {"provider": os.environ["PROVIDER"], "api_mode": os.environ["API_MODE"],
                        "model": os.environ["MODEL"], "base_url": os.environ["BASE_URL"],
                        "api_key": os.environ.pop("DEDICATED_KEY")}
          subprocess.run([sys.executable, "-m", "scripts.e2e.provider_conversation", "--evidence",
                          str(Path(os.environ["RUNNER_TEMP"]) / "provider-evidence")],
                         input=json.dumps(credential), text=True, check=True, env=os.environ.copy())
          PY
      - name: Upload exact-head qualification receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-${{ inputs.connection }}-${{ matrix.mode }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/provider-evidence/
          if-no-files-found: warn
          retention-days: 14

  acceptance:
    name: Live provider gate
    if: always()
    needs: [select, live]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected connection, protocol and OS to execute successfully
        env:
          CONFIGURATION: ${{ needs.select.result }}
          RESULT: ${{ needs.live.result }}
        run: |
          test "$CONFIGURATION" = success && test "$RESULT" = success
