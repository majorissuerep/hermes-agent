name: Qualified public mirror

on:
  push:
    branches: [mirror/qualification]
  workflow_dispatch:
    inputs:
      test_profile:
        description: Focused integration checks by default; broad native coverage is opt-in.
        type: choice
        options: [focused, full]
        default: focused
      build_payloads:
        description: Build complete native terminal assets after qualification; does not publish a release.
        type: boolean
        default: false
      source_commit:
        description: Exact commit SHA of the dispatched ref; required when building payloads.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: qualified-mirror-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native:
    name: Native qualification (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HERMES_TEST_FILE_RETRIES: '0'
      HERMES_CI_TEST_PROFILE: ${{ inputs.test_profile || 'focused' }}
      HERMES_TEST_IMAGE_REF: debian:13-slim@sha256:a29215f6a35e51e22adffa17f89e9d2ef06214e64a2bad10d765c46aea49f11f
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind requested payload build to this qualified source
        if: github.event_name == 'workflow_dispatch' && inputs.build_payloads
        env:
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          python3 - <<'PY'
          import os, re
          source = os.environ["REQUESTED_SOURCE"]
          assert re.fullmatch(r"[0-9a-f]{40}", source), "supply the exact source SHA"
          assert source == os.environ["GITHUB_SHA"], "dispatch the same source ref as source_commit"
          PY
      - uses: ./.github/actions/setup-pm
        id: pm
        with:
          toolchain: all
          packages: ripgrep
          extras: '["all", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
      - name: Build the real terminal UI
        run: npm ci --workspace ui-tui --ignore-scripts --no-audit --no-fund && npm run build --workspace ui-tui
      - name: Prepare native Linux prerequisites
        if: runner.os == 'Linux'
        env:
          HERMES_TEST_SSHD_IMAGE: ${{ env.HERMES_TEST_IMAGE_REF }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apparmor-utils bubblewrap
          if [ "$HERMES_CI_TEST_PROFILE" = full ]; then
            scripts/ci/start_test_sshd.sh "$RUNNER_TEMP/hermes-test-sshd"
          fi
      - name: Native terminal, platform and lifecycle protocols
        env:
          HERMES_TEST_DOCKER_IMAGE: ${{ env.HERMES_TEST_IMAGE_REF }}
          UV_CACHE_DIR: ${{ steps.pm.outputs.uv-cache-path }}
        run: python -m scripts.ci.native_checks
      - name: Lint the application Dockerfile
        if: runner.os == 'Linux'
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning
      - name: Lint the terminal sandbox Dockerfile
        if: runner.os == 'Linux'
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: docker/sandbox-terminal.Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning
      - name: Check container shell scripts
        if: runner.os == 'Linux'
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          SHELLCHECK_OPTS: --severity=error
        with:
          scandir: ./docker

  payload:
    name: Build terminal payload (${{ matrix.os }})
    needs: [native]
    if: github.event_name == 'workflow_dispatch' && inputs.build_payloads && needs.native.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pm
        id: pm
        with:
          toolchain: all
      - name: Compile and stage the complete terminal product
        env:
          UV_CACHE_DIR: ${{ steps.pm.outputs.uv-cache-path }}
        run: |
          set -euo pipefail
          node scripts/build/node-deps.mjs --source "$GITHUB_WORKSPACE" --workspace ui-tui --workspace apps/shared
          node scripts/build/tui.mjs --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/release-tui"
          python scripts/bundles/stage.py --ref "$GITHUB_SHA" --tui "$RUNNER_TEMP/release-tui" --out "$RUNNER_TEMP/release-payload" --cache "$UV_CACHE_DIR"
      - name: Check the packaged launcher and record source provenance
        env:
          PAYLOAD_TARGET: ${{ steps.pm.outputs.target }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/payload-smoke-home"
          HOME="$RUNNER_TEMP/payload-smoke-home" HERMES_HOME="$RUNNER_TEMP/payload-smoke-home/profile" HERMES_RUNTIME_DIR="$RUNNER_TEMP/release-payload/tools" "$RUNNER_TEMP/release-payload/bin/hermes" --version
          python scripts/bundles/release.py --payload "$RUNNER_TEMP/release-payload" --out "$RUNNER_TEMP/release-assets" --commit "$GITHUB_SHA" --target "$PAYLOAD_TARGET"
      - name: Upload build assets for independent lifecycle acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-payload-${{ steps.pm.outputs.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  required:
    name: All required checks pass (v2)
    needs: [native, payload]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected consumer to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          BUILD_PAYLOADS: ${{ github.event_name == 'workflow_dispatch' && inputs.build_payloads && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          selected = os.environ["BUILD_PAYLOADS"] == "true"
          assert set(results) == {"native", "payload"}, results
          assert results["native"]["result"] == "success", results
          assert results["payload"]["result"] == ("success" if selected else "skipped"), results
          PY
