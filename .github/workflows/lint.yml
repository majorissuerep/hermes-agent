name: Lint (ruff + ty)

# Three things here:
#   1. Advisory diff — ruff + ty diagnostics as a diff vs the target branch.
#      Writes a Markdown summary to the run page. Exit zero always.
#   2. Blocking ``ruff check .`` — enforces the explicit rules in
#      ``[tool.ruff.lint.select]`` (currently PLW1514). Failure blocks merge.
#      Separate job so the advisory diff still runs even when enforcement
#      fails.
#   3. Blocking code-health ratchet (``scripts/code_health``) for Python and TypeScript.
# ``python scripts/check`` runs every blocking check here locally with the same pinned tools.
#
# CI-sensitive file review is enforced by .github/CODEOWNERS, not a CI job.

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      event_name:
        description: The event name from the calling orchestrator (pull_request or push).
        type: string
        required: true
      python:
        description: Python changed. A frontend-only PR runs just the code-health ratchet (TS).
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: lint-${{ (github.ref_type == 'tag' || inputs.commit != '') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.commit == '' }}

jobs:
  lint-diff:
    name: ruff + ty diff
    if: inputs.event_name == 'pull_request' && inputs.python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0 # need full history for merge-base + worktree

      - uses: ./.github/actions/setup-pm
        with:
          cache-python: true
          prune-python-cache: true

      - name: Install ruff + ty
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)" ty==0.0.82

      - name: Determine base ref
        id: base
        run: |
          # For PRs, diff against the merge base with the target branch.
          # For pushes to main, diff against the previous commit on main.
          if [ "${{ inputs.event_name }}" = "pull_request" ]; then
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            BASE_REF="HEAD~1"
          fi
          echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "Base SHA: ${BASE_SHA}"
          echo "Base ref: ${BASE_REF}"

      # Reports live under $RUNNER_TEMP, not the checkout: the clean-worktree step at the end of
      # every job fails (or warns) on untracked files, and .lint-reports/ is not gitignored.
      - name: Run ruff + ty on HEAD
        run: |
          R="$RUNNER_TEMP/lint-reports"
          mkdir -p "$R/head"
          ruff check --output-format json --exit-zero \
            > "$R/head/ruff.json" || true
          ty check --output-format gitlab --exit-zero \
            > "$R/head/ty.json" || true
          echo "HEAD ruff: $(wc -c < "$R/head/ruff.json") bytes"
          echo "HEAD ty:   $(wc -c < "$R/head/ty.json") bytes"

      - name: Run ruff + ty on base (via git worktree)
        run: |
          R="$RUNNER_TEMP/lint-reports"
          mkdir -p "$R/base"
          # Use a worktree so we don't clobber the main checkout. If the basex
          # SHA is identical to HEAD (e.g. first commit), skip and leave the
          # base reports empty — the diff script handles missing files.
          HEAD_SHA=$(git rev-parse HEAD)
          BASE_SHA="${{ steps.base.outputs.sha }}"
          if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            echo "Base SHA == HEAD SHA, skipping base scan."
            echo '[]' > "$R/base/ruff.json"
            echo '[]' > "$R/base/ty.json"
          else
            git worktree add --detach /tmp/lint-base "$BASE_SHA"
            (
              cd /tmp/lint-base
              ruff check --output-format json --exit-zero \
                > "$R/base/ruff.json" || true
              ty check --output-format gitlab --exit-zero \
                > "$R/base/ty.json" || true
            )
            git worktree remove --force /tmp/lint-base
          fi
          echo "base ruff: $(wc -c < "$R/base/ruff.json") bytes"
          echo "base ty:   $(wc -c < "$R/base/ty.json") bytes"

      - name: Generate diff summary
        env:
          HEAD_REF: ${{ inputs.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          R="$RUNNER_TEMP/lint-reports"
          python scripts/lint_diff.py \
            --base-ruff "$R/base/ruff.json" \
            --head-ruff "$R/head/ruff.json" \
            --base-ty   "$R/base/ty.json" \
            --head-ty   "$R/head/ty.json" \
            --base-ref  "${{ steps.base.outputs.ref }}" \
            --head-ref  "$HEAD_REF" \
            --output    "$R/summary.md"
          cat "$R/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the checkout is clean
        # Last step of every job (tests/ci/test_clean_worktree_check.py): a test or CI step that
        # leaves an untracked or modified file in the checkout is reported here. Runs only when
        # every earlier step passed: a step that failed midway can leave its own temp files
        # (a half-extracted download, a worktree its later cleanup never removed).
        uses: ./.github/actions/check-clean-worktree

  ruff-blocking:
    # Enforce the rules in pyproject.toml [tool.ruff.lint.select]. Currently
    # PLW1514 (unspecified-encoding) — catches bare ``open()`` /
    # ``read_text()`` / ``write_text()`` calls that default to locale
    # encoding on Windows. Failure here blocks merge; the advisory
    # ``lint-diff`` job above runs independently so reviewers still get
    # the diff comment even when enforcement fails.
    name: ruff enforcement (blocking)
    if: inputs.python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit }}

      - uses: ./.github/actions/setup-pm
        with:
          cache-python: true
          prune-python-cache: true

      - name: Install ruff
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)"

      - name: ruff check  .
        # No --exit-zero, no || true. Exit code propagates to the job,
        # which propagates to the required-check gate.
        run: |
          ruff check .

      - name: Check the checkout is clean
        # Last step of every job (tests/ci/test_clean_worktree_check.py): a test or CI step that
        # leaves an untracked or modified file in the checkout is reported here. Runs only when
        # every earlier step passed: a step that failed midway can leave its own temp files
        # (a half-extracted download, a worktree its later cleanup never removed).
        uses: ./.github/actions/check-clean-worktree

  code-health:
    # Per-unit ratchet: every function and file keeps its own cap (its value on main when it is
    # already over target, else the target) and pattern rules compare fingerprints, so a PR
    # cannot trade one violation for another. The merge commit is compared with its first
    # parent (current main), so an improvement that lands on main is locked in at once.
    name: code health ratchet (blocking)
    if: inputs.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0 # first parent plus ancestry of the pinned full-history upstream input

      - uses: ./.github/actions/setup-pm
        with:
          cache-python: true
          prune-python-cache: true

      - name: Install pinned ruff
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)"

      - name: Ratchet the PR against the base branch tip
        run: python scripts/check --only health --base HEAD^1

      - name: Check the checkout is clean
        # Last step of every job (tests/ci/test_clean_worktree_check.py): a test or CI step that
        # leaves an untracked or modified file in the checkout is reported here. Runs only when
        # every earlier step passed: a step that failed midway can leave its own temp files
        # (a half-extracted download, a worktree its later cleanup never removed).
        uses: ./.github/actions/check-clean-worktree
