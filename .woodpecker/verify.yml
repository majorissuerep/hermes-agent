when:
  - event: [pull_request, manual]
  - event: push
    branch: main

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      depth: 0
      partial: false
      fetch_target_branch: true
      target_branch: main

steps:
  - name: checks
    image: docker.io/library/python@sha256:a8cf203c684b61fd2676ec5a17159cf68ed38ad471481e1f4ebc4679825250bd
    commands:
      - apt-get update
      - apt-get install --no-install-recommends -y zsh
      - python3 scripts/ci/verify.py
    environment:
      CI: "true"
      VITEST_MAX_WORKERS: "2"
      NODE_OPTIONS: --max-old-space-size=2048
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 6Gi
