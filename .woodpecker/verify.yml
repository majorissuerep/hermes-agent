when:
  - event: [pull_request, manual]
  - event: push
    branch: main

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    backend_options:
      kubernetes:
        nodeSelector:
          theincompetent.dev/hermes-verification: "true"
    settings:
      # Use the same credential home for the initial and target-branch fetches.
      home: /root
      depth: 256
      partial: false
      fetch_target_branch: true
      target_branch: main
      # Repository-only read authority stays valid through slow checkouts.
      use_ssh: true
      remote_ssh: ssh://git@gitea-ssh.gitea.svc.cluster.local:22/unpossible/hermes-agent.git
      ssh_key_private:
        from_secret: gitea_clone_key
      ssh_host_key: >-
        gitea-ssh.gitea.svc.cluster.local ssh-rsa 

steps:
  - name: checks
    image: docker.io/library/python@sha256:a8cf203c684b61fd2676ec5a17159cf68ed38ad471481e1f4ebc4679825250bd
    commands:
      - apt-get update
      - apt-get install --no-install-recommends -y zsh tini
      - verification_root="$(mktemp -d)"
      - trap 'rm -rf -- "$verification_root"' EXIT
      - cp -a . "$verification_root/source"
      - cd "$verification_root/source"
      - export CI_WORKSPACE="$verification_root/source"
      - tini -s -- python3 scripts/ci/verify.py
    environment:
      CI: "true"
      VITEST_MAX_WORKERS: "2"
      NODE_OPTIONS: --max-old-space-size=2048
    backend_options:
      kubernetes:
        # An operator-qualified worker; never tolerate node pressure to run checks.
        nodeSelector:
          theincompetent.dev/hermes-verification: "true"
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
            ephemeral-storage: 2Gi
          limits:
            cpu: "4"
            memory: 6Gi
            ephemeral-storage: 16Gi
