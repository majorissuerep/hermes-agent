# Interactive local terminal; no listener or background gateway is started.
# Run: docker compose run --rm hermes
services:
  hermes:
    build: .
    image: hermes-agent
    stdin_open: true
    tty: true
    volumes:
      - hermes-data:/opt/data
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
    command: ["chat"]
volumes:
  hermes-data:
