pre-commit:
  jobs:
    - name: lint python
      glob: "*.py" # glob filter
      run: ruff check --config ./ruff.pre-commit.toml {staged_files}

    - name: lint tui
      root: ui-tui/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint shared
      root: apps/shared/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}

    - name: lint tests
      root: tests-js/
      glob: "*.{js,ts,tsx}"
      run: npx eslint {staged_files}
